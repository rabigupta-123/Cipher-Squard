<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CIPHER SQUAD — Security Operations Center</title>
<style nonce="__CSP_NONCE__">
/* ============================================================================
   DESIGN TOKENS
   Enterprise SOC + forensic investigation platform. Light, dense, restrained.
   ========================================================================= */
:root{
  /* surfaces */
  --bg:#F4F6FB;
  --panel:#FFFFFF;
  --panel-2:#FAFBFD;
  --panel-3:#F7F9FC;
  --line:#E3E8F0;
  --line-2:#D2D9E4;
  --line-3:#C2CBD9;

  /* ink */
  --ink:#1A1F2B;
  --ink-2:#5A6478;
  --ink-3:#8B95A7;
  --ink-4:#AAB2C1;

  /* security accent — orange/amber */
  --accent:#D9700C;
  --accent-2:#B85B06;
  --accent-soft:#FDF1E4;
  --accent-line:#F2C99B;

  /* semantic status */
  --green:#157F45;
  --green-soft:#E7F4EC;
  --green-line:#A9D8BF;
  --amber:#A9700A;
  --amber-soft:#FCF3E3;
  --amber-line:#E8CE96;
  --red:#BE2626;
  --red-soft:#FBEAEA;
  --red-line:#EFB3B3;
  --blue:#1B67A8;
  --blue-soft:#E9F1F9;
  --blue-line:#AECDE8;
  --gray:#78829A;
  --gray-soft:#EFF1F6;
  --gray-line:#D5DAE4;

  /* type */
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;

/* shape */
  --r:3px;
  --r-2:6px;
  --shadow:0 1px 2px rgba(20,28,45,.05);
  --shadow-2:0 4px 14px rgba(20,28,45,.09);

  --sbw:232px;
  --topbar:46px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:14px/1.45 var(--sans);
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
code,.mono{font-family:var(--mono)}
::selection{background:var(--accent-soft);color:var(--accent-2)}

/* scrollbars — restrained */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-3);border:3px solid var(--bg);border-radius:6px}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}
*::-webkit-scrollbar-track{background:transparent}

/* ============================================================================
   APP SHELL
   ========================================================================= */
#shell{display:flex;min-height:100vh}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:var(--sbw);flex:0 0 var(--sbw);
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{
  display:flex;align-items:center;gap:9px;
  padding:13px 14px;border-bottom:1px solid var(--line);
  background:var(--panel);
}
.brand-mark{
  width:26px;height:26px;flex:0 0 26px;border-radius:var(--r);
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font:700 12px/1 var(--mono);letter-spacing:.02em;
}
.brand-txt{min-width:0}
.brand-name{font:700 13px/1.15 var(--sans);letter-spacing:.10em;text-transform:uppercase}
.brand-sub{font:600 9.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}

.nav{flex:1;padding:6px 0 14px}
.nav-sect{padding:12px 14px 5px}
.nav-sect span{font:700 9.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-4)}
.nav-i{
  display:flex;align-items:center;gap:8px;
  padding:6px 14px;cursor:pointer;
  border-left:2px solid transparent;
  font-size:12.5px;color:var(--ink-2);
}
.nav-i:hover{background:var(--panel-3);color:var(--ink)}
.nav-i.on{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent-2);font-weight:600}
.nav-i .ic{width:15px;flex:0 0 15px;text-align:center;font-size:11px;color:var(--ink-3)}
.nav-i.on .ic{color:var(--accent)}
.nav-i .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-i .tg{
  font:700 8.5px/1 var(--sans);letter-spacing:.06em;
  padding:2px 4px;border-radius:var(--r-2);
  background:var(--gray-soft);color:var(--gray);border:1px solid var(--gray-line);
}
.nav-foot{
  padding:10px 14px;border-top:1px solid var(--line);
  font:600 9.5px/1.5 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);
}

/* ---------- TOPBAR ---------- */
#mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{
  height:var(--topbar);flex:0 0 var(--topbar);
  background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 18px;
  position:sticky;top:0;z-index:40;
}
.crumb{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.crumb b{font:600 12.5px/1 var(--sans);white-space:nowrap}
.crumb .sep{color:var(--ink-4);font-size:11px}
.crumb span{font:500 11.5px/1 var(--sans);color:var(--ink-3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top-r{display:flex;align-items:center;gap:8px}
#utc{font:600 11px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.search{
  display:flex;align-items:center;gap:6px;
  height:27px;padding:0 9px;min-width:212px;
  background:var(--panel-3);border:1px solid var(--line-2);border-radius:var(--r);
}
.search input{
  flex:1;min-width:0;border:0;background:transparent;outline:0;
  font-size:12px;color:var(--ink);
}
.search input::placeholder{color:var(--ink-4)}
/* Glyph colour comes from a class, not an inline style, so the CSP can stay strict. */
.search .mag{color:var(--ink-4);font-size:13px;line-height:1}
.lnk{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-line);cursor:pointer}
.lnk:hover{border-bottom-color:var(--accent)}
.ibwrap{display:flex;flex-direction:column;gap:8px}
.svgtpl{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}

/* search results flyout — anchored to the topbar search field */
.sout{position:fixed;right:14px;top:60px;width:min(560px,calc(100vw - 28px));max-height:min(62vh,560px);
  overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-2);
  box-shadow:0 14px 38px rgba(20,28,45,.16);padding:9px;display:none;z-index:70}
.sout.on{display:block}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,28,45,.42);display:none;align-items:center;
  justify-content:center;padding:18px;z-index:90}
.modal.on{display:flex}
.lcard{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-2);
  box-shadow:0 20px 52px rgba(20,28,45,.24);padding:18px;width:min(480px,100%);
  max-height:calc(100vh - 36px);overflow:auto;display:flex;flex-direction:column;gap:13px}
.lhead{display:flex;align-items:center;gap:11px}
.lhead h2{font-size:15px}
.lhead .sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.lmark{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--accent);color:#fff;font:800 13px var(--sans);letter-spacing:.02em}

/* toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,14px);opacity:0;
  background:var(--ink);color:#fff;border-radius:var(--r);padding:9px 14px;font-size:12.5px;
  box-shadow:0 12px 30px rgba(20,28,45,.3);transition:opacity .18s ease,transform .18s ease;
  pointer-events:none;z-index:95;max-width:min(520px,calc(100vw - 28px))}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--green)}
.toast.warn{background:var(--red)}
.who{
  display:flex;align-items:center;gap:7px;padding:3px 9px 3px 4px;
  border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel-3);
}
.who .av{
  width:20px;height:20px;border-radius:var(--r-2);background:var(--ink-2);color:#fff;
  display:flex;align-items:center;justify-content:center;font:700 9.5px/1 var(--sans);
  text-transform:uppercase;
}
.who .nm{font:600 11.5px/1 var(--sans)}
.who .rl{font:600 9px/1 var(--sans);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}

/* ---------- LIVE / status pills ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px;border-radius:var(--r-2);
  font:700 9.5px/1.25 var(--sans);letter-spacing:.07em;text-transform:uppercase;
  border:1px solid;white-space:nowrap;
}
.dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:currentColor}
.p-green{background:var(--green-soft);color:var(--green);border-color:var(--green-line)}
.p-amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.p-red{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
.p-blue{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
.p-gray{background:var(--gray-soft);color:var(--gray);border-color:var(--gray-line)}
.p-accent{background:var(--accent-soft);color:var(--accent-2);border-color:var(--accent-line)}
.p-live .dot{animation:bp 2s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.28}}

/* ============================================================================
   PAGE / PANEL SYSTEM
   ========================================================================= */
#view{flex:1;padding:16px 18px 28px;max-width:1680px;width:100%}
.ph{margin-bottom:13px}
.ph h1{
  margin:0;font:700 17px/1.2 var(--sans);letter-spacing:.04em;text-transform:uppercase;
}
.ph .sub{margin-top:4px;font-size:12px;color:var(--ink-2);max-width:105ch}
.ph-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}

.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);margin-bottom:12px;
}
.ph-2{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);
  border-radius:var(--r) var(--r) 0 0;
}
.ph-2 h2{
  margin:0;font:700 10.5px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);
  display:flex;align-items:center;gap:7px;
}
.ph-2 h2 .bar{width:2px;height:11px;background:var(--accent);border-radius:1px}
.ph-2 .act{display:flex;align-items:center;gap:6px}
.pb{padding:11px 12px}
.pb.tight{padding:0}
.note{font-size:11px;color:var(--ink-3);line-height:1.5}
.note.wr{border-left:2px solid var(--amber);background:var(--amber-soft);
  padding:7px 9px;border-radius:0 var(--r) var(--r) 0;color:var(--amber)}
.note.nc{border-left:2px solid var(--gray);background:var(--gray-soft);
  padding:7px 9px;border-radius:0 var(--r) var(--r) 0;color:var(--gray)}
.empty{padding:22px 12px;text-align:center;color:var(--ink-4);font-size:12px}
.empty b{display:block;font:700 10.5px/1.4 var(--sans);letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

/* grids */
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.ws{display:grid;grid-template-columns:48fr 52fr;gap:12px;align-items:start}

/* ============================================================================
   METRIC CARDS
   ========================================================================= */
.mc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 11px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.mc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line-3)}
.mc.g::before{background:var(--green)}
.mc.a::before{background:var(--accent)}
.mc.r::before{background:var(--red)}
.mc.b::before{background:var(--blue)}
.mc.y::before{background:var(--gray)}
.mc-l{display:flex;align-items:center;justify-content:space-between;gap:6px;
  font:700 9.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.mc-v{font:700 26px/1.1 var(--mono);margin:7px 0 3px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mc-v.unknown{font-size:14px;color:var(--ink-4);letter-spacing:.04em}
.mc-f{font:500 10.5px/1.4 var(--sans);color:var(--ink-3)}

/* ============================================================================
   TABLES
   ========================================================================= */
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{
  text-align:left;padding:6px 9px;background:var(--panel-3);
  font:700 9.5px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1;
}
table.t td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr:hover{background:var(--panel-2)}
table.t td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.t td.mono{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.twrap{max-height:330px;overflow:auto}
.twrap.tall{max-height:520px}
.clickable{cursor:pointer}

/* ============================================================================
   KEY/VALUE
   ========================================================================= */
dl.kv{display:grid;grid-template-columns:minmax(96px,auto) 1fr;gap:0}
dl.kv>dt{
  padding:5px 10px 5px 0;font:600 9.5px/1.4 var(--sans);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);
}
dl.kv>dd{
  padding:5px 0;margin:0;font-size:12px;color:var(--ink);
  border-bottom:1px solid var(--line);word-break:break-word;
}
dl.kv>dt:last-of-type,dl.kv>dd:last-of-type{border-bottom:0}
dl.kv .mono{font-size:11.5px}

/* ============================================================================
   BUTTONS
   ========================================================================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:29px;padding:0 12px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);
  font:700 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
}
.btn:hover:not(:disabled){border-color:var(--line-3);color:var(--ink);background:var(--panel-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.btn.sm{height:24px;padding:0 8px;font-size:9.5px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,
.nav-i:focus-visible,.clickable:focus-visible{
  outline:2px solid var(--blue);outline-offset:1px
}

/* inputs */
.inp,.ta{
  width:100%;padding:7px 9px;background:var(--panel);
  border:1px solid var(--line-2);border-radius:var(--r);outline:0;
  font:12.5px/1.5 var(--mono);color:var(--ink);
}
.inp:focus,.ta:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-soft)}
.ta{min-height:340px;resize:vertical;white-space:pre-wrap;word-break:break-word}
.inp.sans{font-family:var(--sans);font-size:12.5px}
select.inp{cursor:pointer}

/* ============================================================================
   GAUGE (SVG attribute-driven — no inline style, CSP-safe)
   ========================================================================= */
.gauge{display:block;width:100%;max-width:280px;margin:0 auto}
.gauge .bg{stroke:var(--line)}
.gauge .fg{transition:stroke-dashoffset 800ms cubic-bezier(.4,0,.2,1)}
.gauge .num{font:700 30px var(--mono);fill:var(--ink);font-variant-numeric:tabular-nums}
.gauge .cap{font:700 8.5px var(--sans);letter-spacing:.12em;fill:var(--ink-3)}

/* meter via svg rect (width attribute, not style) */
.meter{display:block;width:100%;height:6px}
.meter .tr{fill:var(--line)}
.meter .fl{transition:width 700ms cubic-bezier(.4,0,.2,1)}
.f-green{fill:var(--green)} .f-amber{fill:var(--amber)} .f-red{fill:var(--red)}
.f-blue{fill:var(--blue)} .f-gray{fill:var(--gray)} .f-accent{fill:var(--accent)}
/* Stroke counterparts. The .f- family above only sets fill, so an arc drawn with
   stroke and given an .f- class would render with no paint at all. Anything that
   is stroked uses these instead. */
.s-green{stroke:var(--green)} .s-amber{stroke:var(--amber)} .s-red{stroke:var(--red)}
.s-blue{stroke:var(--blue)} .s-gray{stroke:var(--gray)} .s-accent{stroke:var(--accent)}

/* risk ring */
.ring{display:block;flex:0 0 auto}
.ring circle{transition:stroke-dashoffset 900ms cubic-bezier(.4,0,.2,1)}
.ring .trk{stroke:var(--line)}
.ring .val{font:700 19px var(--mono);fill:var(--ink);font-variant-numeric:tabular-nums}
.ring .max{font:600 8.5px var(--sans);fill:var(--ink-4);letter-spacing:.08em}
.ring .cap{font:700 8px var(--sans);letter-spacing:.09em;fill:var(--ink-3)}

/* ============================================================================
   MODULE BOARD
   ========================================================================= */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.mod{border:1px solid var(--line);border-radius:var(--r);padding:8px 9px;background:var(--panel-2);
  transition:border-color 240ms ease,background 240ms ease}
.mod:hover{border-color:var(--line-3)}
.mod.on{border-color:var(--green-line);background:var(--green-soft)}
.mod.warn{border-color:var(--amber-line);background:var(--amber-soft)}
.mod.off{border-color:var(--gray-line);background:var(--gray-soft)}
.mod-h{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.mod-n{font:700 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;flex:1;color:var(--ink-2)}
.mod-s{font:700 9px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase}
.mod-d{font:500 10.5px/1.45 var(--sans);color:var(--ink-3)}
.mod.on .mod-s{color:var(--green)} .mod.warn .mod-s{color:var(--amber)}
.mod.off .mod-s{color:var(--gray)}

/* ============================================================================
   EVENT STREAM
   ========================================================================= */
.ev{display:grid;grid-template-columns:66px 60px 1fr auto;gap:8px;align-items:baseline;
  padding:6px 10px;border-bottom:1px solid var(--line);font-size:11.5px}
.ev:last-child{border-bottom:0}
.ev:hover{background:var(--panel-2)}
.ev-t{font:600 10.5px var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev-s{font:700 9px/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase}
.ev-d{color:var(--ink);min-width:0;word-break:break-word}
.ev-x{font:600 10px var(--mono);color:var(--ink-4)}
.sev-INFO{color:var(--blue)} .sev-LOW{color:var(--green)}
.sev-MEDIUM{color:var(--amber)} .sev-HIGH{color:var(--accent)} .sev-CRITICAL{color:var(--red)}
.ev.enter{animation:evin 320ms cubic-bezier(.2,.8,.3,1)}
@keyframes evin{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}

/* ============================================================================
   FINDINGS
   ========================================================================= */
.layer{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden;background:var(--panel)}
.layer-h{display:flex;align-items:center;gap:8px;padding:6px 9px;background:var(--panel-3);
  border-bottom:1px solid var(--line)}
.layer-h b{font:700 9.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;flex:1;color:var(--ink-2)}
.layer-h .n{font:700 9px/1 var(--sans);color:var(--ink-4)}
.layer-d{padding:6px 9px 0;font-size:11px;color:var(--ink-3);line-height:1.45}
.layer .find:first-of-type{margin-top:6px}
.find{padding:7px 9px;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:0}
.find-h{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.find-b{font:700 10px/1 var(--sans);letter-spacing:.05em}
.find-t{font-size:12px;color:var(--ink);font-weight:500}
.find-m{font-size:10.5px;color:var(--ink-3);margin-top:3px;line-height:1.5}
.find-m .lb{color:var(--ink-4);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:9.5px}

/* family scoring */
.fam{border:1px solid var(--line);border-radius:var(--r);padding:8px 9px;background:var(--panel-2)}
.fam-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:6px}
.fam-n{font:700 9.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fam-v{font:700 14px/1 var(--mono);font-variant-numeric:tabular-nums}
.fam-f{font-size:10px;color:var(--ink-4);margin-top:5px}

/* verdict block */
.verd{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.verd>div{background:var(--panel);padding:8px 10px}
.verd dt{font:700 9px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.verd dd{margin:3px 0 0;font:600 13px/1.3 var(--sans)}
.action{border:1px solid var(--accent-line);background:var(--accent-soft);
  border-radius:var(--r);padding:9px 11px;margin-top:9px}
.action .t{font:700 9.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--accent-2)}
.action .v{font:700 15px/1.3 var(--sans);margin:4px 0 3px}
.action .d{font-size:11px;color:var(--ink-2);line-height:1.5}

/* ============================================================================
   GRAPH
   ========================================================================= */
.gwrap{position:relative;background:
  linear-gradient(0deg,rgba(234,238,246,.5) 1px,transparent 1px) 0 0/100% 22px,
  linear-gradient(90deg,rgba(234,238,246,.5) 1px,transparent 1px) 0 0/22px 100%,var(--panel-2);
  border-bottom:1px solid var(--line)}
#graph{display:block;width:100%;height:452px;cursor:grab;touch-action:none}
#graph.drag{cursor:grabbing}
.gnode{cursor:pointer;transform-box:fill-box;transform-origin:center}
.gnode rect{transition:stroke-width 160ms ease,filter 160ms ease}
/* Graph nodes are rebuilt on each render, so they enter with a one-shot
   keyframe. The gd0-gd9 classes carry the stagger, which keeps the delay in
   the stylesheet instead of in an inline style. */
.gnode.gin{animation:gnodein 420ms cubic-bezier(.4,0,.2,1) both}
.gnode.gd0{animation-delay:0ms}   .gnode.gd1{animation-delay:30ms}
.gnode.gd2{animation-delay:60ms}  .gnode.gd3{animation-delay:90ms}
.gnode.gd4{animation-delay:120ms} .gnode.gd5{animation-delay:150ms}
.gnode.gd6{animation-delay:180ms} .gnode.gd7{animation-delay:210ms}
.gnode.gd8{animation-delay:240ms} .gnode.gd9{animation-delay:270ms}
@keyframes gnodein{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.gnode text{font:600 9px var(--mono);fill:var(--ink-2);pointer-events:none;
  dominant-baseline:middle;text-anchor:middle}
.gnode .sub{font:500 8px var(--sans);fill:var(--ink-4)}
.gnode.sel rect{stroke-width:2}
.gnode.dim{opacity:.22}
.gedge{transition:stroke 200ms ease,stroke-width 200ms ease,opacity 200ms ease}
.gedge.trace{stroke-width:2.4;animation:flow 1.15s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.glbl{font:500 8.5px var(--mono);fill:var(--ink-4);pointer-events:none}
.gtools{display:flex;align-items:center;gap:6px;padding:6px 9px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-wrap:wrap}
.gsel{border:1px solid var(--line-2);background:var(--panel-2);border-radius:var(--r);padding:6px 9px;
  font-size:11.5px;flex:1;min-width:180px}
.gsel b{font:700 9.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);
  display:block;margin-bottom:3px}
.gedge{fill:none;stroke:var(--line-2);stroke-width:1.3}
.gnode rect{fill:var(--panel);stroke:var(--line-2);stroke-width:1.2}
.gnode.t-accent rect{stroke:var(--accent);fill:var(--accent-soft)}
.gnode.t-blue   rect{stroke:var(--blue);fill:var(--blue-soft)}
.gnode.t-amber  rect{stroke:var(--amber);fill:var(--amber-soft)}
.gnode.t-red    rect{stroke:var(--red);fill:var(--red-soft)}
.gnode.t-gray   rect{stroke:var(--line-2);fill:var(--gray-soft)}
.gnode.sel rect{filter:drop-shadow(0 2px 5px rgba(20,28,45,.2))}
.gnode.sel text{fill:var(--ink)}
#arrow path{fill:var(--line-2)}
.gtracekey{display:flex;flex-wrap:wrap;gap:4px 10px;padding:5px 9px;border-top:1px solid var(--line);
  font:500 10px var(--sans);color:var(--ink-3);background:var(--panel)}
.gtracekey i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;
  vertical-align:middle;border:1px solid var(--line-2)}
.kv-wrap{display:flex;flex-direction:column;gap:10px}

/* relay path */
.relay{position:relative;padding:4px 0}
.hop{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start}
.hop-r{position:relative;display:flex;flex-direction:column;align-items:center;align-self:stretch}
.hop-n{width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1.5px solid var(--blue);
  background:var(--panel);color:var(--blue);display:flex;align-items:center;justify-content:center;
  font:700 9px/1 var(--mono);z-index:1}
.hop.res .hop-n{border-color:var(--gray);color:var(--gray)}
.hop-l{width:1.5px;flex:1;background:var(--line-2);min-height:14px}
.hop:last-child .hop-l{display:none}
.hop-b{padding-bottom:12px;min-width:0}
.hop-t{font:700 9.5px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.hop-m{font:11px/1.5 var(--mono);color:var(--ink-2);margin-top:3px;word-break:break-all}
.hop-r2{font:11px/1.5 var(--sans);color:var(--ink-3);margin-top:2px}

/* timeline */
.tl{position:relative;padding-left:19px}
.tl::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1.5px;background:var(--line-2)}
.tl-e{position:relative;padding:0 0 12px}
.tl-e:last-child{padding-bottom:0}
.tl-d{position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;
  background:var(--panel);border:2px solid var(--blue)}
.tl-e.warn .tl-d{border-color:var(--amber)} .tl-e.ok .tl-d{border-color:var(--green)}
.tl-t{font:700 9.5px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.tl-t2{font:10.5px/1.4 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
/* Timeline rows enter in sequence. Delays live in these classes so no inline
   style is needed, and they cap at 330ms so a long timeline does not crawl. */
.tl-e.tlin{animation:tlentry 380ms ease-out both}
.tl-e.td0{animation-delay:0ms}    .tl-e.td1{animation-delay:28ms}
.tl-e.td2{animation-delay:56ms}   .tl-e.td3{animation-delay:84ms}
.tl-e.td4{animation-delay:112ms}  .tl-e.td5{animation-delay:140ms}
.tl-e.td6{animation-delay:168ms}  .tl-e.td7{animation-delay:196ms}
.tl-e.td8{animation-delay:224ms}  .tl-e.td9{animation-delay:252ms}
.tl-e.td10{animation-delay:280ms} .tl-e.td11{animation-delay:308ms}
@keyframes tlentry{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
/* The rail is drawn behind the dots; fading it in avoids a hard line appearing
   before its markers. */
.tl::before{animation:tlfade 500ms ease-out both}
@keyframes tlfade{from{opacity:0}to{opacity:1}}

/* audit strip */
.aud{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;
  padding:10px 12px;border-radius:var(--r);border:1px solid}
.aud.ok{background:var(--green-soft);border-color:var(--green-line)}
.aud.warn{background:var(--amber-soft);border-color:var(--amber-line)}
.aud.bad{background:var(--red-soft);border-color:var(--red-line)}
.aud-k{font:700 13px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.aud.ok .aud-k{color:var(--green)} .aud.warn .aud-k{color:var(--amber)} .aud.bad .aud-k{color:var(--red)}
.aud-d{font-size:11.5px;color:var(--ink-2);line-height:1.5}
.aud-d code{font-size:10.5px;word-break:break-all}

/* report numbered sections */
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.rep-h{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.rep-h .no{width:17px;height:17px;flex:0 0 17px;border-radius:var(--r-2);background:var(--ink-2);
  color:#fff;display:flex;align-items:center;justify-content:center;font:700 9px/1 var(--mono)}
.rep-h b{font:700 9.5px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* ========================================================================
   RESPONSIVE — sidebar collapses, workspace goes vertical
   ======================================================================== */
#navtoggle{display:none}
@media(max-width:1180px){
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:1000px){
  .ws{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{min-width:132px}
  #utc{display:none}
}
@media(max-width:820px){
  :root{--sbw:0px}
  #navtoggle{display:inline-flex}
  #sidebar{position:fixed;left:0;top:0;z-index:60;width:236px;flex-basis:236px;
    transform:translateX(-100%);transition:transform 200ms ease;
    box-shadow:var(--shadow-2)}
  #sidebar.open{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(20,28,45,.34);z-index:55;display:none}
  #scrim.on{display:block}
  .g5,.g4,.g3,.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  #view{padding:13px 12px 24px}
  .who .rl{display:none}
}
@media(max-width:560px){
  .g5,.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}
  .search{min-width:96px}
  #crumb .sep,#crumb span{display:none}
  .ev{grid-template-columns:58px 54px 1fr}
  .ev-x{display:none}
}

/* ========================================================================
   MOTION — only where it carries information
   ======================================================================== */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important;
  }
  .gauge .fg,.meter .fl,.ring circle,.gedge{transition:none !important}
  /* One-shot entry animations are neutralised above by animation-duration, but
     the node delay classes would still hold a node invisible for its delay
     window. Zeroing them as well means a reduced-motion viewer sees the graph
     complete immediately. */
  .gnode.gin,.tl-e.tlin,.tl::before{animation:none !important}
}
</style>
</head>
<body>

<div id="shell">

  <!-- ==================== SIDEBAR ==================== -->
  <nav id="sidebar" aria-label="Primary">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">CS</div>
      <div class="brand-txt">
        <div class="brand-name">Cipher Squad</div>
        <div class="brand-sub">Email Threat Forensics</div>
      </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="nav-foot">
      AICTE PS ID 26106<br>
      Local analysis engine<br>
      Weights: HAND_SET_UNCALIBRATED —<br>risk scores are advisory, not calibrated
    </div>
  </nav>
  <div id="scrim"></div>

  <!-- Namespace donor for sv(): the parser puts the SVG namespace on this node, so the
       script never has to spell out an absolute URI. Hidden, and never populated. -->
  <svg id="svgtpl" class="svgtpl" aria-hidden="true" focusable="false"></svg>

  <!-- ==================== MAIN ==================== -->
  <div id="mainwrap">
    <header id="topbar">
      <button class="btn sm" id="navtoggle" aria-label="Toggle navigation">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="top-r">
        <span class="pill p-gray" id="livePill"><span class="dot"></span>Offline</span>
        <span class="pill p-gray" id="postPill">Posture —</span>
        <span id="utc">—:—:— UTC</span>
        <div class="search">
          <span class="mag" aria-hidden="true">⌕</span>
          <input id="q" type="search" placeholder="Search case, IP or domain..."
                 aria-label="Search cases, IP addresses or domains" autocomplete="off">
        </div>
        <div class="who" id="who">
          <div class="av" aria-hidden="true">–</div>
          <div>
            <div class="nm" id="whoNm">Signed out</div>
            <div class="rl" id="whoRl">No session</div>
          </div>
        </div>
        <button class="btn sm" id="btnOut" disabled>Sign out</button>
      </div>
    </header>

<main id="view"></main>
  </div>
</div>

<div id="searchOut" class="sout" aria-live="polite"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Sign in" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script nonce="__CSP_NONCE__">
(function () {
"use strict";

/* ======================================================================
   0. HONESTY HELPERS
   Every value that reaches the screen came from the backend. These three
   states are distinct and are never collapsed into each other:
     UNKNOWN         backend did not supply a value
     NO DATA         backend supplied an empty collection
     NOT CONFIGURED  the module/provider does not exist in this build
   ====================================================================== */
/* The three absence markers are distinct and are never collapsed. "Unknown" means
   the backend did not report the value; "No data" means the field was reported as
   absent; "Not configured" means the capability is not compiled into this build. */
var UNKNOWN = "Unknown", NODATA = "NO DATA", NOCFG = "NOT CONFIGURED", NA = "N/A";

function isEmpty(v) {
  return v === null || v === undefined || v === "" ||
         (Array.isArray(v) && v.length === 0);

/** Display form of a value the backend may legitimately not have sent. */
function s(v) {
  if (v === undefined) return UNKNOWN;
  if (v === null || v === "") return UNKNOWN;
  if (typeof v === "boolean") return v ? "YES" : "NO";
  if (typeof v === "number") return !isFinite(v) ? UNKNOWN : String(v);
  if (Array.isArray(v)) return v.length ? v.join(", ") : NODATA;
  return String(v);

  if (typeof v !== "number" || !isFinite(v)) return UNKNOWN;
  return dp === undefined ? String(v) : v.toFixed(dp);

   obj(payload).field reads yield undefined instead of throwing. Every absence
   check still goes through num/count/lst, which render undefined as UNKNOWN. */

   it matters here because email headers are the hostile input.

    if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;

    if (k.slice(0, 2) === "on") { n.addEventListener(k.slice(2), v); continue; }

   literal. The namespace URI is an identifier, not a fetch, but this document
   carries no absolute URLs at all, which is easier to audit and to assert. */

  var n = document.createElementNS(SVGNS, tag), k, v;
  for (k in attrs || null) {

    v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "text") { n.textContent = String(v); continue; }
    if (k.slice(0, 2) === "on") { n.addEventListener(k.slice(2), v); continue; }
    n.setAttribute(k, String(v));
  }
  for (var i = 2; i < arguments.length; i++) append(n, arguments[i]);
  return n;

  if (child === null || child === undefined || child === false || child === "") return parent;
  if (Array.isArray(child)) {

    return parent;

    child.nodeType ? child : document.createTextNode(String(child)));

function frag() { var f = document.createDocumentFragment(); return f; }

/* ======================================================================
   2. APPLICATION STATE
   Nothing here is seeded with a plausible-looking value. `counters`
   counts things this console actually did and observed.
   ====================================================================== */
var MAX_BODY = 2 * 1024 * 1024;
var PAGE_SIZE = 25;

var state = {
  token: null,
  user: null,
  roles: [],
  analysis: null,
  report: null,
  cases: null,
  audit: null,
  live: false,
  lastOkAt: 0,
  counters: { analyzed: 0, openedCase: 0, iocSeen: 0, reports: 0, verifies: 0 },
  events: [],
  route: { name: "command-center", arg: null },
  lastAnalysisCorrelation: null,
  graph: null
};

/* ======================================================================
   3. TRANSPORT
   Every call emits a real event carrying the real endpoint, real HTTP
   status and real outcome. Nothing is invented. No request is made
   unauthenticated unless it is explicitly a credential probe.
   ====================================================================== */
function api(path, opts) {
  opts = opts || {};
  var init = { method: opts.method || "GET", cache: "no-store", credentials: "omit" };
  var hdrs = {};
  if (state.token) hdrs["Authorization"] = "Bearer " + state.token;
  if (opts.basic) {
    hdrs["Authorization"] = "Basic " + btoa(opts.basic.user + ":" + opts.basic.pass);
  }
  if (opts.body !== undefined && opts.body !== null) {
    init.body = opts.body;
    hdrs["Content-Type"] = opts.type || "application/octet-stream";
  }
  init.headers = hdrs;

  var t0 = Date.now();
  var ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 45000);

      if (res.status === 200 || res.status === 201) markLive();

        ok: res.ok, status: res.status, data: data, text: txt,
        token: res.headers.get("X-Session-Token"),

function errText(r, what) {
  if (r.transport) return what + " could not reach the service (" + (r.error || "network error") + ").";
  var d = (r.data && typeof r.data === "object") ? r.data : null;
  if (d && d.message) return String(d.message);

function pushEvent(sev, what, detail, status) {
  state.events.unshift({
    t: new Date().toISOString().slice(11, 19),
    sev: sev, what: what, detail: detail || "", status: status === undefined ? "" : String(status)

  if (state.events.length > 60) state.events.length = 60;
  if (state.route.name === "command-center") paintEvents();

function sevForBand(band) {
  switch (String(band || "").toUpperCase()) {
    case "CRITICAL": return "CRITICAL";
    case "HIGH": return "HIGH";
    case "MEDIUM": return "MEDIUM";
    case "LOW": return "LOW";
    default: return "INFO";
  }

/* ======================================================================
   4. DATA REFRESH — the only sources of dashboard truth
   ====================================================================== */
function refreshAudit() {
  return api("/api/audit/verify").then(function (r) {
    if (r.ok && obj(r.data)) { state.audit = r.data; state.counters.verifies++; }
    else { state.audit = null; }
    paintTop();
    return r;
  });
}
function refreshCases() {
  return api("/api/cases?page=1&pageSize=" + PAGE_SIZE).then(function (r) {
    if (r.ok && obj(r.data)) { state.cases = r.data; return r; }
    state.cases = null;
    return r;
  });
}
function refreshAll() {
  return Promise.all([refreshAudit(), refreshCases()]).then(function () {
    paintTop();
  });
}

/* Derived console facts. Each one names the backend field it came from. */
function facts() {
  var a = state.audit, c = state.cases;
  var f = {
    auditKnown: !!a, casesKnown: !!c,
    records: a ? a.records : null,
    assurance: a ? a.assurance : null,
    chainIntact: a ? a.chainIntact : null,
    sigConfigured: a ? a.signatureConfigured : null,
    lastSignedIndex: a ? a.lastSignedIndex : null,
    lastSignatureValid: a ? !!a.lastSignatureValid : null,
    headSignatureValid: a ? !!a.headSignatureValid : null,
    signEveryN: a ? a.signEveryN : null,
    headHash: a ? a.headHash : null,
    reason: a ? a.reason : null,
    totalCases: c ? c.total : null,
    cases: c ? lst(c.cases) : [],
    analyzedThisSession: state.counters.analyzed

  var hi = 0, open = 0, iocs = 0, maxRisk = null;
  if (c) {
    lst(c.cases).forEach(function (k) {
      var b = String(k.band || "").toUpperCase();
      if (b === "HIGH" || b === "CRITICAL") hi++;
      if (String(k.status || "") === "open") open++;
      iocs += lst(k.hopAddresses).length + lst(k.urls).length + lst(k.attachmentHashes).length;
      var r = typeof k.riskFinal === "number" ? k.riskFinal : k.risk;
      if (typeof r === "number" && (maxRisk === null || r > maxRisk)) maxRisk = r;

  f.iocs = c ? iocs : null;

  /* Engines are real only if this build actually contains them and the last

    name: "RISK MODEL", state: m ? "on" : "idle", on: !!m,

  });
  f.engines.push({
    name: "ATTRIBUTION", state: state.analysis ? "on" : "idle", on: !!state.analysis,
    d: state.analysis ? ("confidence " + String(obj(state.analysis.attribution).confidence ?
        obj(state.analysis.attribution).confidence.band : UNKNOWN)) : "local engine, idle"
  });
  f.engines.push({
    name: "CORRELATION", state: state.analysis ? "on" : "idle", on: !!state.analysis,
    d: state.analysis ? (num(obj(state.analysis.correlation).documentsConsidered, 0) + " documents considered")
         : "local engine, idle"
  });
  f.engines.push({
    name: "AUDIT SIGNER", state: f.sigConfigured ? "on" : "cfg",
    on: !!f.sigConfigured,
    d: f.sigConfigured
        ? ("ed25519 key configured · checkpoint every " + count(f.signEveryN) + " records")
        : "no signing key in this data directory"
  });
  f.enrichmentKnown = state.analysis ? (obj(state.analysis.attribution).enrichment !== undefined) : false;
  f.enrichmentPresent = state.analysis ? !!obj(state.analysis.attribution).enrichment : false;
  f.enginesOnline = f.engines.filter(function (x) { return x.on; }).length;
  f.enginesTotal = f.engines.length;
  return f;
}

/* Posture is a CONSOLE rollup of named backend fields, never a backend score.
   The inputs are printed in the panel so the arithmetic is auditable. */
function posture(f) {
  if (!f.casesKnown) return { known: false };
  var inputs = [];
  var score = 0, basis = 0;
  var mr = f.maxRisk;
  if (typeof mr === "number") {
    var w = 50;
    inputs.push({ k: "max stored case riskFinal", v: num(mr, 2) + " / 100", w: w });
    score += Math.max(0, Math.min(100, mr)) * (w / 100);
    basis += w;
  }
  if (f.auditKnown) {
    var asr = String(f.assurance || "");
    var av = asr === "SIGNED" ? 0 : asr === "UNSIGNED" ? 35 : asr === "TAMPERED" ? 100 : null;
    if (av !== null) {
      var w2 = 30;
      inputs.push({ k: "audit assurance = " + asr, v: av + " / 100", w: w2 });
      score += av * (w2 / 100);
      basis += w2;
    }
  }
  if (f.casesKnown) {
    var w3 = 20;
    var op = f.openCases;
    inputs.push({ k: "open cases", v: count(op), w: w3 });
    score += Math.max(0, Math.min(20, op || 0)) * (w3 / 20);
    basis += w3;
  }
  if (basis === 0) return { known: false };
  var val = score / basis;
  var band = val >= 70 ? "CRITICAL" : val >= 45 ? "ELEVATED" : val >= 20 ? "GUARDED" : "BASELINE";
  return { known: true, value: val, band: band, inputs: inputs };
}

/* ======================================================================
   10. INVESTIGATION GRAPH (SVG, attribute-driven)
   Nodes exist only for fields the case actually carries.
   ====================================================================== */
function buildGraph(k, at) {
  var W = 900, Hh = 452;
  var svg = sv("svg", { id: "graph", viewBox: "0 0 " + W + " " + Hh,
                        role: "img", "aria-label": "Investigation relationship graph" });
  var gRoot = sv("g", { id: "gRoot" }, svg);
  var gE = sv("g", null, gRoot), gN = sv("g", null, gRoot);
  var nodes = [], edges = [], seq = 0;

  function N(type, key, label, x, y) {
    var n = { id: "n" + (seq++), type: type, key: key, label: label, x: x, y: y };
    nodes.push(n); return n;
  }
  function E(a, b, label) { edges.push({ a: a, b: b, label: label || "" }); }

  var mail = N("EMAIL", k.documentId, trunc(k.subject || k.documentId, 22), W / 2, 46);
  var fromList = lst(k.addresses).slice(0, 1);
  var from = fromList.length ? N("SENDER", fromList[0], trunc(fromList[0], 20), W / 2 - 200, 120) : null;
  var to = N("RECIPIENT", k.members[0] || "unknown", trunc(k.members[0] || "unknown", 20), W / 2 + 200, 120);
  if (from) E(from, mail, "from");
  E(to, mail, "to");

  var hops = lst(at.hops);
  hops.slice(0, 4).forEach(function (hp, i) {
    var y = 190 + i * 76;
    var x = W / 2 - 200 + (i % 2) * 400;
    var hn = N("HOST", hp.host || "hop" + i, trunc(hp.host || "hop " + i, 20), x, y);
    E(mail, hn, "relay " + (i + 1));
    if (hp.ipObserved) {
      var ipn = N("IP", hp.ipObserved, hp.ipObserved, x + 150, y);
      E(hn, ipn, "observed at");
    }
  });

  var doms = lst(k.domains).slice(0, 3);
  doms.forEach(function (d, i) {
    var dn = N("DOMAIN", d, trunc(d, 20), W / 2 - 300 + i * 300, Hh - 52);
    if (from) E(from, dn, "domain");
  });
  lst(k.urls).slice(0, 3).forEach(function (u, i) {
    var un = N("URL", u, trunc(u, 24), 120 + i * 250, Hh - 130);
    E(mail, un, "url");
  });
  lst(k.attachmentHashes).slice(0, 2).forEach(function (hh, i) {
    var hn2 = N("HASH", hh, trunc(hh, 16), W - 220, Hh - 130 + i * 70);
    E(mail, hn2, "attachment");
  });
  if (lst(k.members).length > 1) {
    var cm = N("CAMPAIGN", "cluster", "cluster " + lst(k.members).length + " member(s)", W - 130, 46);
    lst(k.members).slice(0, 4).forEach(function (m) { E(cm, N("EMAIL", m, trunc(m, 20), W - 260, 150), "member"); });
  }

  var TONE = { EMAIL: "accent", SENDER: "blue", RECIPIENT: "blue", DOMAIN: "blue",
               HOST: "blue", IP: "amber", URL: "amber", HASH: "amber", CAMPAIGN: "red" };

  /* ---- edges ---- */
  edges.forEach(function (e) {
    var x1 = e.a.x, y1 = e.a.y, x2 = e.b.x, y2 = e.b.y;
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    var lx = x2 - x1, ly = y2 - y1;
    var len = Math.sqrt(lx * lx + ly * ly) || 1;
    var ux = lx / len, uy = ly / len;
    var off = 78;
    e.ax = x1 + ux * off; e.ay = y1 + uy * off;
    e.bx = x2 - ux * off; e.by = y2 - uy * off;
    var bend = Math.min(26, len / 6);
    e.cx = mx - uy * bend; e.cy = my + ux * bend;
    e.d = "M " + e.ax.toFixed(1) + " " + e.ay.toFixed(1) +
          " Q " + e.cx.toFixed(1) + " " + e.cy.toFixed(1) +
          " " + e.bx.toFixed(1) + " " + e.by.toFixed(1);
    gE.appendChild(sv("path", { "class": "gedge", d: e.d, "marker-end": "url(#arrow)" }));
    e.el = gE.lastChild;
    if (e.label) {
      var lb = sv("text", {
        "class": "glbl", x: ((e.ax + e.bx + e.cx) / 3).toFixed(1),
        y: ((e.ay + e.by + e.cy) / 3 - 4).toFixed(1), "text-anchor": "middle",
        text: e.label
      });
      gE.appendChild(lb);
      e.lb = lb;
    }
  });

  /* ---- nodes ---- */
  nodes.forEach(function (nd) {
    var w = Math.max(96, Math.min(210, 13 + String(nd.label).length * 7.1));
    var g = sv("g", { "class": "gnode t-" + (TONE[nd.type] || "gray"), tabindex: "0",
                      role: "button", "aria-label": nd.type + " " + String(nd.key) });
    g.appendChild(sv("rect", { x: (nd.x - w / 2).toFixed(1), y: (nd.y - 19).toFixed(1),
                                width: w.toFixed(1), height: 38, rx: 7 }));
    g.appendChild(sv("text", { x: nd.x.toFixed(1), y: (nd.y - 2).toFixed(1),
                               "text-anchor": "middle", text: nd.type }));
    g.appendChild(sv("text", { "class": "sub", x: nd.x.toFixed(1), y: (nd.y + 12).toFixed(1),
                               "text-anchor": "middle", text: String(nd.label) }));
    g.__n = nd;
    function pick() {
      nodes.forEach(function (o) { o.el.classList.remove("sel"); });
      edges.forEach(function (e) { e.el.classList.remove("trace"); });
      g.classList.add("sel");
      edges.filter(function (e) { return e.a === nd || e.b === nd; })
        .forEach(function (e) { e.el.classList.add("trace"); });
      paintInspector();
    }
    g.addEventListener("click", pick);
    g.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); }
    });
    nd.el = g;
    gN.appendChild(g);
  });
  /* Graph nodes are rebuilt on every render, so they cannot rely on a CSS
     transition from a prior state. Stagger them in as a traversal instead, and
     let settleIn skip everything under reduced motion. */
  settleIn(nodes.map(function (nd) { return nd.el; }), 420);

  /* ---- defs + pan/zoom ---- */
  var defs = sv("defs", null, svg);
  var mk = sv("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5,
                          markerWidth: 5.5, markerHeight: 5.5, orient: "auto-start-reverse" });
  mk.appendChild(sv("path", { "class": "glbl", d: "M 0 0 L 10 5 L 0 10 z" }));
  defs.appendChild(mk);

  var vb = { x: 0, y: 0, w: W, h: Hh };
  function applyVB() { svg.setAttribute("viewBox", vb.x.toFixed(1) + " " + vb.y.toFixed(1) + " " + vb.w.toFixed(1) + " " + vb.h.toFixed(1)); }
  function zoom(f, cx, cy) {
    var nw = Math.max(220, Math.min(2400, vb.w * f));
    var nh = nw * (Hh / W);
    var k = nw / vb.w;
    vb.x = cx - (cx - vb.x) * k;
    vb.y = cy - (cy - vb.y) * k;
    vb.w = nw; vb.h = nh;
    clampVB(); applyVB();
  }
  function clampVB() {
    vb.w = Math.max(220, Math.min(2400, vb.w));
    vb.h = vb.w * (Hh / W);
    vb.x = Math.max(-W * 0.5, Math.min(W * 1.5 - vb.w, vb.x));
    vb.y = Math.max(-Hh * 0.5, Math.min(Hh * 1.5 - vb.h, vb.y));
  }
  function zoomAt(f, clientX, clientY) {
    var r = svg.getBoundingClientRect();
    zoom(f, vb.x + ((clientX - r.left) / r.width) * vb.w,
            vb.y + ((clientY - r.top) / r.height) * vb.h);
  }
  svg.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    zoomAt(ev.deltaY < 0 ? 0.86 : 1.16, ev.clientX, ev.clientY);
  }, { passive: false });
  var drag = null;
  svg.addEventListener("pointerdown", function (ev) {
    if (ev.target.closest && ev.target.closest(".gnode")) return;
    drag = { px: ev.clientX, py: ev.clientY, vx: vb.x, vy: vb.y };
    svg.classList.add("drag");
    if (svg.setPointerCapture) { try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* detached */ } }
  });
  svg.addEventListener("pointermove", function (ev) {
    if (!drag) return;
    var r = svg.getBoundingClientRect();
    vb.x = drag.vx - ((ev.clientX - drag.px) / r.width) * vb.w;
    vb.y = drag.vy - ((ev.clientY - drag.py) / r.height) * vb.h;
    clampVB(); applyVB();
  });
  function endDrag() { drag = null; svg.classList.remove("drag"); }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  svg.addEventListener("pointerleave", endDrag);

  /* ---- inspector ---- */
  var ins = h("div", { "class": "kv-wrap" });
  function paintInspector() {
    clear(ins);
    var sel = nodes.filter(function (n) { return n.el && n.el.classList.contains("sel"); })[0];
    if (!sel) {
      ins.appendChild(note("Select a node in the graph to inspect the value the backend returned for it.", "nc"));
      return;
    }
    var rel = edges.filter(function (e) { return e.a === sel || e.b === sel; });
    ins.appendChild(kv([
      ["Type", sel.type],
      ["Key", sel.key, "mono"],
      ["Connections", rel.length],
      ["Field source", sel.type === "EMAIL" ? "case.addresses / case.members"
         : sel.type === "HOST" ? "attribution.hops[].host"
         : sel.type === "IP" ? "attribution.hops[].ipObserved"
         : sel.type === "URL" ? "case.urls"
         : sel.type === "HASH" ? "case.attachmentHashes"
         : sel.type === "DOMAIN" ? "case.domains"
         : sel.type === "CAMPAIGN" ? "correlation.members" : "case record"]
    ]));
    if (rel.length) {
      var tb = h("tbody");
      rel.forEach(function (e) {
        var other = e.a === sel ? e.b : e.a;
        tb.appendChild(h("tr", { "class": "clickable" },
          h("td", { text: other.type }),
          h("td", { "class": "mono", text: trunc(String(other.key), 30) }),
          h("td", { text: e.label })));
      });
      ins.appendChild(h("div", { "class": "twrap" },
        h("table", { "class": "t" },
          h("thead", null, h("tr", null,
            h("th", { text: "Connects to" }), h("th", { text: "Value" }), h("th", { text: "Relation" }))),
          tb)));
    }
  }
  paintInspector();

  return {
    svg: svg,
    inspector: function () { return ins; },
    reset: function () { vb.x = 0; vb.y = 0; vb.w = W; vb.h = Hh; applyVB(); },
    fit: function () { vb.x = 0; vb.y = 0; vb.w = W; vb.h = Hh; applyVB(); },
    zoom: function (f) { zoom(f, vb.x + vb.w / 2, vb.y + vb.h / 2); }
  };
}

        btn("Command center", function () { location.hash = "#/command-center"; }, "sm")))));

  view.appendChild(panel("Module status", h("div", null,
    h("div", { "class": "empty" },
      h("b", { text: label + " " + NOCFG }),
      h("div", { text: reasons[id] || "No implementation for this module is compiled into this build." })),
    note("Nothing on this page is stubbed to look functional. A placeholder that renders plausible-looking data would be worse than an honest gap, so there is no data here to render."))));

  view.appendChild(panel("What this build does cover", h("div", null,
    table(["Capability", "Where it lives"], [
      ["Header and MIME parsing", "Email analysis"],
      ["SPF / DKIM / DMARC evaluation", "Email analysis"],
      ["Relay path extraction", "Case investigation"],
      ["URL and attachment-hash extraction", "Email analysis"],
      ["Hand-set risk scoring", "Email analysis"],
      ["Local campaign correlation", "Email analysis"],
      ["Evidence hashing per case", "Case investigation"],
      ["STIX 2.1 export", "Reports"],
      ["Hash-linked audit chain with Ed25519 checkpoints", "Audit"]
    ].map(function (r) {
      var target = r[1] === "Audit" ? "#/audit" : r[1] === "Reports" ? "#/reports" :
                   r[1] === "Case investigation" ? "#/cases" : "#/analysis";
      return { cells: [h("td", { text: r[0] }),
                       h("td", null, h("a", { href: "#" + target.slice(1), "class": "lnk", text: r[1] }))] };
    })))));
}

/* ======================================================================
   20. EXPORT — real downloads, no server round-trip where not needed
   ====================================================================== */
function download(url, filename) {
  if (!state.token) { toast("Sign in to export.", "warn"); return; }
  api(url).then(function (r) {
    if (!r.ok) { pushEvent("HIGH", "export failed", url, r.status); toast(errText(r, "Export"), "warn"); return; }
    saveBlob(r.text, filename, "application/json");
    pushEvent("LOW", "export generated", filename, r.status);
    toast("Saved " + filename, "ok");
  });
}
function downloadJSON(obj, filename) {
  saveBlob(JSON.stringify(obj, null, 2), filename, "application/json");
  pushEvent("LOW", "export generated", filename, "200");
  toast("Saved " + filename, "ok");
}
function downloadReport(rep, id) {
  downloadJSON(rep, "case-" + id + ".report.json");
}
function saveBlob(text, filename, mime) {
  var blob = new Blob([text], { type: mime });
  var url = URL.createObjectURL(blob);
  var a = h("a", { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

/* ======================================================================
   21. SEARCH — honest about what the backend supports
   The backend has no search endpoint. The console searches the pages it
   has already fetched, and says so rather than implying a server index.
   ====================================================================== */
function runSearch(q) {
  var host = document.getElementById("searchOut");
  if (!host) return;
  clear(host);
  var term = String(q || "").trim().toLowerCase();
  if (term.length < 2) {
    host.appendChild(note("Type at least two characters. Search runs over the case register already loaded in this tab."));
    return;
  }
  var hits = [];
  lst(obj(state.cases).cases).forEach(function (k) {
    [["case id", String(k.id)], ["subject", String(k.subject || "")],
     ["document", String(k.documentId || "")], ["message", String(k.messageId || "")],
     ["band", String(k.band || "")], ["verdict", String(k.verdict || "")],
     ["evidence hash", String(k.evidenceHash || "")]].forEach(function (p) {
      if (p[1] && p[1].toLowerCase().indexOf(term) >= 0) {
        hits.push({ kind: "case", id: k.id, where: p[0], val: p[1] });
      }
    });
    lst(k.domains).forEach(function (d) {
      if (String(d).toLowerCase().indexOf(term) >= 0) hits.push({ kind: "case", id: k.id, where: "domain", val: d });
    });
    lst(k.urls).forEach(function (u) {
      if (String(u).toLowerCase().indexOf(term) >= 0) hits.push({ kind: "case", id: k.id, where: "url", val: u });
    });
    lst(k.hopAddresses).forEach(function (ip) {
      if (String(ip).toLowerCase().indexOf(term) >= 0) hits.push({ kind: "case", id: k.id, where: "ip", val: ip });
    });
  });
  var a = state.analysis;
  if (a) {
    [["document id", String(a.documentId || "")], ["subject", String(a.subject || "")],
     ["message id", String(a.messageId || "")]].forEach(function (p) {
      if (p[1] && p[1].toLowerCase().indexOf(term) >= 0)
        hits.push({ kind: "analysis", id: "", where: p[0], val: p[1] });
    });
  }

  host.appendChild(h("div", { "class": "find-h" },
    h("span", { "class": "find-t", text: hits.length + " match(es) in loaded data" }),
    h("span", { "class": "pill p-gray", text: "client-side, case register only" })));

  if (!hits.length) {
    host.appendChild(note("No match in the case register loaded in this tab. This console does not query a server-side search index, because the backend exposes none.", "nc"));
    return;
  }
  var tb = h("tbody");
  hits.slice(0, 40).forEach(function (hit) {
    var tr = h("tr", { "class": hit.kind === "case" ? "clickable" : "", tabindex: hit.kind === "case" ? "0" : null,
                        role: hit.kind === "case" ? "button" : null },
      h("td", null, h("span", { "class": "pill p-blue", text: hit.kind })),
      h("td", { text: hit.where }),
      h("td", { "class": "mono", text: trunc(String(hit.val), 52) }),
      h("td", { "class": "mono", text: hit.kind === "case" ? trunc(String(hit.id), 20) : NODATA }));
    if (hit.kind === "case") {
      function open() { location.hash = "#/case/" + encodeURIComponent(hit.id); }
      tr.addEventListener("click", open);
      tr.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    }
    tb.appendChild(tr);
  });
  host.appendChild(h("div", { "class": "twrap" },
    h("table", { "class": "t" },
      h("thead", null, h("tr", null, h("th", { text: "In" }), h("th", { text: "Field" }),
        h("th", { text: "Value" }), h("th", { text: "Case" }))), tb)));
  if (hits.length > 40) host.appendChild(note("Showing the first 40 of " + hits.length + " matches."));
}

/* ======================================================================
   22. TOAST — one line, self-clearing, never blocking
   ====================================================================== */
var toastT = null;
function toast(msg, kind) {
  var el = document.getElementById("toast");
  if (!el) return;
  el.className = "toast on" + (kind ? " " + kind : "");
  clear(el).appendChild(h("b", { text: msg }));
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(function () { el.className = "toast"; clear(el); }, 4200);
}

/* ======================================================================
   23. AUTH
   Credentials go to the backend over Basic auth on a protected endpoint.
   They are never stored, never logged to console, never put in a URL.
   ====================================================================== */
function openLogin() {
  var back = h("div", { "class": "lcard" });
  var u = h("input", { "class": "inp", id: "lu", type: "text", autocomplete: "username",
                       placeholder: "analyst", spellcheck: "false" });
  var p = h("input", { "class": "inp", id: "lp", type: "password", autocomplete: "current-password",
                       placeholder: "••••••••" });
  var msg = h("div", { "class": "note", text: "Accounts live in the backend data directory. Enter your console credentials to obtain a session token." });

  function submit() {
    var user = u.value, pass = p.value;
    if (!user || !pass) { msg.className = "note wr"; msg.textContent = "Both fields are required."; return; }
    msg.className = "note";
    msg.textContent = "Authenticating…";
    /* A GET on a protected route with Basic credentials is enough to prove
       the account, and it returns the session token header. */
    api("/api/cases?page=1&pageSize=1", { basic: { user: user, pass: pass } }).then(function (r) {
      if (r.ok && r.token) {
        state.token = r.token;
        state.user = user;
        p.value = "";
        msg.className = "note";
        toast("Signed in as " + user, "ok");
        pushEvent("INFO", "signed in", user, r.status);
        closeLogin();
        paintTop();
        refreshAll().then(renderView);
        return;
      }
      if (r.status === 429) {
        msg.className = "note wr";
        msg.textContent = "Account locked. The backend asks you to retry after " +
          (r.retryAfter ? r.retryAfter + " seconds" : "a delay") + ".";
        return;
      }
      msg.className = "note wr";
      msg.textContent = r.status === 401 || r.status === 403
        ? "Those credentials were rejected by the backend."
        : errText(r, "Sign-in");
    });
  }

  back.appendChild(h("div", { "class": "lhead" },
    h("div", { "class": "lmark", "aria-hidden": "true", text: "CS" }),
    h("div", null,
      h("h2", { text: "Sign in to Cipher Squad" }),
      h("div", { "class": "sub", text: "Local email threat forensics console" }))));
  back.appendChild(kv([["Endpoint", "Basic auth on a protected route", "mono"],
                       ["Session", "Bearer token held in memory for this tab", "mono"],
                       ["Storage", "none — no cookies, no localStorage, no persistence", "mono"]]));
  back.appendChild(h("div", { "class": "g2" },
    h("div", null, h("div", { "class": "nav-sect" }, h("span", { text: "Username" })), u),
    h("div", null, h("div", { "class": "nav-sect" }, h("span", { text: "Password" })), p)));
  back.appendChild(msg);
  back.appendChild(h("div", { "class": "top-r" },
    btn("Sign in", submit, "pri"),
    btn("Cancel", closeLogin, "")));
  back.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });

  var m = document.getElementById("modal");
  clear(m).appendChild(back);
  m.className = "modal on";
  m.setAttribute("aria-hidden", "false");
  setTimeout(function () { u.focus(); }, 30);
}
function closeLogin() {
  var m = document.getElementById("modal");
  m.className = "modal";
  m.setAttribute("aria-hidden", "true");
  clear(m);
}
function doSignOut() {
  state.token = null;
  state.user = null;
  state.roles = [];
  state.analysis = null;
  state.report = null;
  state.audit = null;
  state.cases = null;
  state.counters = { analyzed: 0, openedCase: 0, iocSeen: 0, reports: 0, verifies: 0 };
  pushEvent("INFO", "signed out", "token discarded", "");
  paintTop();
  /* Token is gone, so refreshAll would 401. Audit verification is public. */
  refreshAudit().then(renderView);
}
function requireAuth(what) {
  if (state.token) return true;
  toast("Sign in to " + what + ".", "warn");
  openLogin();
  return false;
}

/* ======================================================================
   24. ROUTER + PAINT
   ====================================================================== */
function parseRoute() {
  var raw = String(location.hash || "").replace(/^#\/?/, "");
  var parts = raw.split("/").filter(function (x) { return x.length; });
  if (!parts.length) return { name: "command-center", arg: null };
  var head = parts[0];
  if (head === "case") return { name: "case", arg: decodeURIComponent(parts[1] || "") };
  if (head.indexOf("mod-") === 0) return { name: "module", arg: head };
  if (NAV.some(function (sec) { return sec.items.some(function (i) { return i.id === head; }); }))
    return { name: head, arg: null };
  return { name: "command-center", arg: null };
}
function renderView() {
  var r = parseRoute();
  state.route = r;
  paintNav();
  paintCrumb();
  closeSearch();
  switch (r.name) {
    case "command-center": pageCommandCenter(); break;
    case "workspace": pageWorkspace(); break;
    case "analysis": pageAnalysis(); break;
    case "toolkit": pageToolkit(); break;
    case "cases": pageCases(); break;
    case "incidents": pageIncidents(); break;
    case "ioc": pageIoc(); break;
    case "reports": pageReports(); break;
    case "audit": pageAudit(); break;
    case "settings": pageSettings(); break;
    case "case": r.arg ? pageCase(r.arg) : pageCases(); break;
    case "module": pageModule(r.arg); break;
    default: pageCommandCenter();
  }
  paintTop();
}
/* renderView() only paints what is already in state. Fetching belongs to the
   caller, otherwise a refresh would re-enter renderView without end. */
function route() {
  if (state.token) return refreshAll().then(renderView);
  return refreshAudit().then(renderView);
}
function openSearch() {
  var o = document.getElementById("searchOut");
  o.className = "sout on";
  document.getElementById("q").focus();
}
function closeSearch() {
  var o = document.getElementById("searchOut");
  o.className = "sout";
  clear(o);
}

/* ======================================================================
   25. BOOT
   ====================================================================== */
function wire() {
  window.addEventListener("hashchange", route);

  var nav = document.getElementById("navtoggle");
  var sb = document.getElementById("sidebar");
  var sc = document.getElementById("scrim");
  nav.addEventListener("click", function () {
    var on = sb.classList.toggle("open");
    sc.classList.toggle("on", on);
    nav.setAttribute("aria-expanded", on ? "true" : "false");
  });
  sc.addEventListener("click", function () {
    sb.classList.remove("open"); sc.classList.remove("on");
  });

  document.getElementById("btnOut").addEventListener("click", function () {
    doSignOut();
    toast("Signed out. The token was discarded.", "ok");
  });
  document.getElementById("who").addEventListener("click", function () {
    if (state.token) location.hash = "#/settings";
    else openLogin();
  });

  var q = document.getElementById("q");
  var qt = null;
  q.addEventListener("input", function () {
    if (qt) clearTimeout(qt);
    qt = setTimeout(function () {
      if (String(q.value).trim().length >= 2) { openSearch(); runSearch(q.value); }
      else closeSearch();
    }, 180);
  });
  q.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { q.value = ""; closeSearch(); q.blur(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      var m = document.getElementById("modal");
      if (m.className === "modal on") closeLogin();
      else closeSearch();
    }
    if (e.key === "/" && document.activeElement && document.activeElement.tagName !== "INPUT" &&
        document.activeElement.tagName !== "TEXTAREA") {
      e.preventDefault(); openSearch();
    }
  });

  setInterval(function () {
    document.getElementById("utc").textContent = utcNow();
  }, 1000);

  /* liveness poll. A 401 proves the service is up, so it counts as live. */
  setInterval(function () {
    if (state.token) refreshAudit();
  }, 30000);
}

function boot() {
  buildNav();
  wire();
  document.getElementById("utc").textContent = utcNow();
  if (!location.hash) location.hash = "#/command-center";
  /* The public route returns 200 without credentials, so a first successful
     call marks the service live even for an anonymous console load. */
  route();
}
boot();
})();
</script>
